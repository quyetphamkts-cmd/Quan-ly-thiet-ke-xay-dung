<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6b8a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sổ Công Trường</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky project bar on top; left rail of sections on desktop, scrolling tab strip on phones; one working view per section. */
:root{
  --bg:#edf0f1; --surface:#ffffff; --ink:#192227; --muted:#58676e; --line:#d5dbde;
  --accent:#0d6b8a; --accent-ink:#ffffff; --accent-soft:#dcedf3;
  --good:#27744a; --good-soft:#dcefe3; --warn:#9a5f05; --warn-soft:#f8ebcf;
  --bad:#a8322b; --bad-soft:#f6dedb; --bar:#cdd5d9; --hatch:#b5c3c9;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171a; --surface:#182126; --ink:#e6edf0; --muted:#93a3ab; --line:#2a373d;
    --accent:#52b6d6; --accent-ink:#06222c; --accent-soft:#1c3943;
    --good:#5cc08a; --good-soft:#1b3326; --warn:#e3a23c; --warn-soft:#38290f;
    --bad:#ec7168; --bad-soft:#3b1d1a; --bar:#2c3a41; --hatch:#3b4d56;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171a; --surface:#182126; --ink:#e6edf0; --muted:#93a3ab; --line:#2a373d;
  --accent:#52b6d6; --accent-ink:#06222c; --accent-soft:#1c3943;
  --good:#5cc08a; --good-soft:#1b3326; --warn:#e3a23c; --warn-soft:#38290f;
  --bad:#ec7168; --bad-soft:#3b1d1a; --bar:#2c3a41; --hatch:#3b4d56;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--body);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 28px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface);
  margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px))) calc(-1 * max(16px, env(safe-area-inset-right,0px)));
  padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line); display:flex; gap:12px 20px; align-items:center; flex-wrap:wrap;
}
.brand{font:700 22px/1 var(--display); letter-spacing:.06em; text-transform:uppercase; margin-right:auto}
.brand small{display:block; font:400 11px/1.3 var(--body); letter-spacing:0; text-transform:none; color:var(--muted); margin-top:3px}
.top label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; min-width:0}
select,input,textarea,button{font:inherit; color:inherit}
select,input[type=text],input[type=number],input[type=date],textarea{
  background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:7px 9px; min-width:0; max-width:100%;
}
textarea{width:100%; resize:vertical; min-height:64px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.layout{display:grid; grid-template-columns:216px minmax(0,1fr); gap:28px; max-width:1200px; margin:18px auto 0}
.nav{display:block; position:sticky; top:calc(env(safe-area-inset-top,0px) + 72px); align-self:start; max-height:calc(100vh - 92px); overflow-y:auto; padding-right:2px}
.acc{display:flex; flex-direction:column; gap:2px}
.m2{display:none}
.nav .gh{width:100%; padding:9px 10px; color:var(--ink); font-weight:600; gap:9px; justify-content:flex-start; margin-top:8px}
.nav .gh:first-child{margin-top:0}
.nav .gh .gt{flex:1; min-width:0; text-align:left}
.nav svg.ic{width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.nav .gh svg.ic{color:var(--accent)}
.nav .gh .chev{width:14px; height:14px; color:var(--muted)}
.nav .gh[aria-expanded=true] .chev{transform:rotate(90deg)}
.nav .gh.cur{background:var(--accent-soft)}
.gi{margin:2px 0 4px 17px; padding-left:8px; border-left:1px solid var(--line); display:flex; flex-direction:column; gap:1px}
.gi button{padding:7px 10px; font-size:13.5px}
.count.soft{background:var(--bar); color:var(--muted)}
.nav button{
  text-align:left; background:none; border:0; border-radius:6px; padding:9px 11px; cursor:pointer; color:var(--muted);
  display:flex; justify-content:space-between; gap:8px; align-items:center;
}
.nav button:hover{background:var(--accent-soft); color:var(--ink)}
.nav button[aria-current=page]{background:var(--accent); color:var(--accent-ink); font-weight:600}
.count{font-size:11px; background:var(--bad); color:#fff; border-radius:10px; padding:0 7px; line-height:18px; min-width:18px; text-align:center}
main{min-width:0}
h1{font:700 30px/1.1 var(--display); text-transform:uppercase; letter-spacing:.04em; margin:0 0 4px; text-wrap:balance}
h2{font:700 18px/1.2 var(--display); text-transform:uppercase; letter-spacing:.05em; margin:0 0 10px; color:var(--muted)}
.sub{color:var(--muted); margin:0 0 18px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; min-width:0}
.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:8px; margin-bottom:16px}
.strip>div{padding:14px 16px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); margin:0 -1px -1px 0}
.strip dt{font-size:12px; color:var(--muted); margin:0}
.strip dd{margin:2px 0 0; font:700 28px/1.1 var(--display); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.strip dd small{font:400 12px var(--body); color:var(--muted); letter-spacing:0}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px}
.row{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) auto; gap:10px 14px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.meter{height:10px; background:var(--bar); border-radius:5px; position:relative; overflow:hidden}
.meter>i{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:5px}
.meter>b{position:absolute; top:0; bottom:0; width:2px; background:var(--ink)}
.meter.over>i{background:var(--bad)}
.pill{display:inline-block; font-size:12px; font-weight:500; padding:1px 9px; border-radius:11px; white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.muted{background:var(--bar); color:var(--muted)}
.alerts{list-style:none; margin:0; padding:0}
#lgList{max-height:62vh; overflow:auto; border-top:1px solid var(--line)}
.lgr{display:flex; gap:10px; align-items:flex-start; padding:7px 2px; border-bottom:1px solid var(--line); font-size:13px; line-height:1.45; min-width:0}
.lgr time{flex:none; width:64px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.lgr>div{min-width:0; overflow-wrap:anywhere}
.lgr pre{margin:4px 0 0; white-space:pre-wrap; font-size:11.5px; color:var(--muted)}
.alerts li{padding:9px 0 9px 12px; border-top:1px solid var(--line); border-left:3px solid var(--warn); margin-bottom:6px; background:var(--warn-soft); border-radius:0 6px 6px 0; border-top:0}
.alerts li.bad{border-left-color:var(--bad); background:var(--bad-soft)}
.alerts li.ok{border-left-color:var(--good); background:var(--good-soft)}
.alerts b{display:block}
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:560px; font-variant-numeric:tabular-nums}
th{font-size:12px; text-align:left; color:var(--muted); font-weight:500; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
td.num,th.num{text-align:right}
.gantt{min-width:720px}
.g-head,.g-row{display:grid; grid-template-columns:230px minmax(0,1fr) 92px; gap:12px; align-items:center}
.g-head{font-size:12px; color:var(--muted); padding-bottom:6px; border-bottom:1px solid var(--line)}
.g-axis{position:relative; height:16px}
.g-axis span{position:absolute; transform:translateX(-50%); font-size:11px; white-space:nowrap}
.g-row{padding:8px 0; border-bottom:1px solid var(--line)}
.g-name{min-width:0}
.g-name b{display:block; font-weight:500; overflow-wrap:anywhere}
.g-name small{color:var(--muted)}
.g-track{position:relative; height:26px; background:repeating-linear-gradient(90deg,transparent 0 calc(var(--tick) - 1px),var(--line) calc(var(--tick) - 1px) var(--tick))}
.g-plan{position:absolute; top:3px; height:8px; border-radius:2px; background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px); border:1px solid var(--hatch)}
.g-act{position:absolute; top:13px; height:10px; border-radius:2px; background:var(--bar); overflow:hidden}
.g-act i{position:absolute; inset:0 auto 0 0; background:var(--accent)}
.g-act.late i{background:var(--bad)}
.g-act.done i{background:var(--good)}
.g-today{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--bad); z-index:2}
.g-pct{display:flex; align-items:center; gap:4px; justify-content:flex-end}
.g-pct input{width:58px; text-align:right}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:10px 0 0}
.legend i{display:inline-block; width:18px; height:8px; vertical-align:middle; margin-right:6px; border-radius:2px}
form.f{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px 12px; align-items:end}
form.f label{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); min-width:0}
form.f label.wide{grid-column:1/-1}
form.f label input,form.f label select{color:var(--ink); width:100%}
.btn{background:var(--accent); color:var(--accent-ink); border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none; border:1px solid var(--line); color:var(--ink); font-weight:500}
.btn.sm{padding:4px 10px; font-size:13px}
.btn.bad{background:var(--bad); color:#fff}
.btn.good{background:var(--good); color:var(--surface)}
.log{padding:12px 0; border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log h3{margin:0 0 4px; font-size:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.log p{margin:2px 0; overflow-wrap:anywhere}
.req{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px; padding:12px 0; border-top:1px solid var(--line); align-items:center}
.req:first-child{border-top:0}
.req b{overflow-wrap:anywhere}
.req small{color:var(--muted)}
.empty{color:var(--muted); padding:8px 0}
.note{font-size:12px; color:var(--muted); margin-top:18px; max-width:70ch}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr); gap:12px; margin-top:12px}
  .nav{position:static; max-height:none; overflow:visible}
  .acc{display:none}
  .m2{display:block}
  .mg{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px}
  .mg button{flex:none; display:flex; align-items:center; gap:6px; white-space:nowrap; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:18px; padding:7px 13px; font-weight:600}
  .mg button[aria-pressed=true]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .mg button[aria-pressed=true] svg.ic{color:inherit}
  .mg svg.ic{color:var(--accent)}
  .mi{display:flex; gap:4px; overflow-x:auto; padding:6px 0 6px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .mi button{white-space:nowrap; flex:none}
  .mg,.mi{scrollbar-width:none}
  .mg::-webkit-scrollbar,.mi::-webkit-scrollbar{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .meter{grid-column:1/-1; order:3}
  h1{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){ .meter>i,.g-act i{transition:width .3s} }
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px}
.tabs .btn[aria-pressed=true]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.search{display:flex; gap:8px; align-items:center; margin:0 0 12px}
.search input{flex:1; min-width:0; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:9px 12px; font:inherit}
details.kb{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0; margin-bottom:10px; min-width:0}
details.kb>summary{cursor:pointer; padding:12px 14px; display:flex; gap:8px 12px; flex-wrap:wrap; align-items:center; list-style:none}
details.kb>summary::-webkit-details-marker{display:none}
details.kb>summary b{flex:1 1 220px; min-width:0}
details.kb>summary::before{content:"+"; font-weight:700; width:14px; color:var(--muted)}
details.kb[open]>summary::before{content:"\2212"}
details.kb .body{padding:0 14px 14px; border-top:1px solid var(--line)}
details.kb h3{font:600 12px/1.2 var(--body); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px}
details.kb ul,details.kb ol{margin:0; padding-left:20px}
details.kb li{padding:2px 0}
.ckrow{display:grid; grid-template-columns:auto 1fr auto; gap:8px 10px; align-items:start; padding:7px 0; border-bottom:1px solid var(--line)}
.ckrow:last-child{border-bottom:0}
.ckrow .acts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.btn.sm[aria-pressed=true].okb{background:var(--good); color:var(--surface); border-color:var(--good)}
.btn.sm[aria-pressed=true].failb{background:var(--bad); color:#fff; border-color:var(--bad)}
.hit{background:var(--accent-soft); border-radius:3px; padding:0 2px}
.res{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:8px; cursor:pointer; color:var(--ink); font:inherit}
.res:hover{border-color:var(--accent)}
.res small{display:block; color:var(--muted); margin-top:2px}
@media (max-width:760px){ .ckrow{grid-template-columns:auto 1fr} .ckrow .acts{grid-column:1/-1; justify-content:flex-start} }
.paperwrap{overflow-x:auto; padding:4px 0 16px}
.page{background:#fff; color:#000; width:210mm; min-height:297mm; margin:0 auto; padding:20mm 18mm 20mm 28mm; box-shadow:0 1px 8px rgba(0,0,0,.25); font:13pt/1.5 "Times New Roman",Times,serif; box-sizing:border-box}
.page h1.dt{font:700 15pt/1.3 "Times New Roman",Times,serif; text-align:center; margin:14px 0 2px; text-transform:uppercase; letter-spacing:0; color:#000}
.page .ds{text-align:center; margin:0 0 10px}
.page h2.d{font:700 13pt/1.4 "Times New Roman",Times,serif; margin:12px 0 4px; text-transform:none; letter-spacing:0; color:#000}
.page .qh{text-align:center; margin-bottom:6px}
.page .dl{text-align:right; margin:4px 0 10px}
.page p{margin:4px 0; text-align:justify}
.page ul{margin:2px 0 4px; padding-left:22px}
.page ul.pl{list-style:none; padding-left:14px; margin:0 0 6px}
.page .dot{color:#666}
.page table.tb{border-collapse:collapse; width:100%; margin:6px 0}
.page table.tb th,.page table.tb td{border:1px solid #000; padding:3px 6px; font-size:12pt; vertical-align:top}
.page table.lh{width:100%; margin-bottom:6px; border-collapse:collapse}
.page table.lh td{vertical-align:top; text-align:center; width:50%}
.page table.sg{width:100%; margin-top:14px; border-collapse:collapse}
.page table.sg td{text-align:center; vertical-align:top}
.page img.logo{max-height:60px}
@media print{
  .top,#nav,.no-print,.note{display:none!important}
  body{background:#fff!important; padding:0!important}
  body::before{display:none!important}
  .layout{display:block!important; margin:0!important}
  #view>*:not(#docPrint){display:none!important}
  .paperwrap{padding:0; overflow:visible}
  .page{box-shadow:none; width:auto; min-height:0; padding:0; margin:0}
  @page{size:A4; margin:20mm 15mm 20mm 25mm}
}
</style>

</head>
<body>
<div class="top">
  <div class="brand">Sổ Công Trường<small>Tiến độ, vật tư, ngân sách, phê duyệt</small></div>
  <label for="projSel">Dự án
    <select id="projSel"></select>
  </label>
  <button class="btn ghost sm" id="resetBtn" type="button">Đặt lại dữ liệu mẫu</button>
</div>
<div class="layout">
  <nav class="nav" id="nav" aria-label="Các mục"></nav>
  <main id="view"></main>
</div>

<script src="nhatky.js"></script>
<script src="kb.js"></script>
<script src="kb2.js"></script>
<script src="forms.js"></script>
<script src="files.js"></script>
<script src="tracuu.js"></script>
<script src="toc.js"></script>
<script>
(function(){
  var KEY='so-cong-truong-v3';
  var DAY=864e5;
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function addDays(n){var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return iso(d)}
  function ts(s){return new Date(s+'T12:00:00').getTime()}
  function fmtD(s){var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]}
  function fmtDM(s){var p=s.split('-'); return p[2]+'/'+p[1]}
  var TODAY=addDays(0);
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function vnd(n){return Math.round(n).toLocaleString('vi-VN')+' ₫'}
  function short(n){
    var a=Math.abs(n);
    if(a>=1e9) return (n/1e9).toFixed(2).replace('.',',')+' tỷ';
    if(a>=1e6) return Math.round(n/1e6).toLocaleString('vi-VN')+' tr';
    return Math.round(n).toLocaleString('vi-VN')+' ₫';
  }
  var uid=0; function nid(p){uid++; return p+Date.now().toString(36)+uid}
  var CK=[['co','Có chứng nhận xuất xưởng (CO) và chất lượng (CQ) của nhà sản xuất'],['tn','Có kết quả thí nghiệm hoặc chứng nhận hợp quy theo yêu cầu'],['qc','Đúng chủng loại, quy cách theo hồ sơ thiết kế'],['nq','Ngoại quan, bao bì, nhãn mác nguyên vẹn'],['mau','Đúng mẫu vật liệu đã được chủ đầu tư duyệt'],['sl','Số lượng khớp phiếu giao hàng']];

  /* ---------- dữ liệu mẫu ---------- */
  function seed(){
    var s={pid:'p1',view:'tong-quan',projects:[],tasks:[],logs:[],mats:[],txs:[],cats:[],exps:[],reqs:[]};
    s.projects=[
      {id:'p1',name:'Shophouse mẫu A (ví dụ)',addr:'Phường Trần Hưng Đạo, Hưng Yên',type:'Kiến trúc',mode:'Thiết kế và thi công',client:'c1',manager:'KTS Minh',phase:'Thi công'},
      {id:'p2',name:'Nhà phố 4 tầng mẫu B (ví dụ)',addr:'Gia Lâm, Hà Nội',type:'Kiến trúc',mode:'Thi công',client:'c2',manager:'KS Hải',phase:'Thi công'},
      {id:'p3',name:'Nội thất căn hộ mẫu C (ví dụ)',addr:'Quận Cầu Giấy, Hà Nội',type:'Nội thất',mode:'Thiết kế và thi công',client:'c3',manager:'KTS Lan',phase:'Thiết kế kỹ thuật thi công'},
      {id:'p4',name:'Cảnh quan sân vườn biệt thự D (ví dụ)',addr:'Thành phố Bắc Ninh',type:'Cảnh quan',mode:'Thiết kế',client:'c4',manager:'KTS Nam',phase:'Thiết kế cơ sở'}

    var max=Math.max.apply(null,list.map(function(t){return ts(t.end)}))+3*DAY;
    var total=(max-min)/DAY+1;
    function pos(t){return (t-min)/DAY/total*100}

    var tickPct=(tick/total*100);
    var rows=list.map(function(t){
      var l=pos(ts(t.start)), w=((ts(t.end)-ts(t.start))/DAY+1)/total*100, st=taskStatus(t);
      var cls=t.pct>=100?'done':(st[1]==='bad'?'late':'');
      var planW=w*planPct(t)/100;

  }

  /* ---------- Thư viện thi công ---------- */
  var lib={tab:'checklist',q:'',grp:'',area:'',open:''};
  var LTABS=[['checklist','Checklist giám sát'],['quy-trinh','Quy trình thi công'],['loi','Lỗi thường gặp'],['su-co','Sự cố'],['qa','Quản lý chất lượng'],['nghiem-thu','Nghiệm thu và lấy mẫu'],['cong-ty','Của công ty'],['tra-cuu','Tra cứu tài liệu gốc'],['nguon','Tài liệu nguồn']];
  var LV={do:['Phải kiểm kỹ','bad'],cam:['Cần yêu cầu sửa','warn'],xanh:['Nên kiểm','good']};
  function norm(s){return String(s==null?'':s).replace(/[đĐ]/g,'d').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
  function ul(a){return a&&a.length?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':''}
  function ol(a){return a&&a.length?'<ol>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>':''}
  function sec(t,html){return html?'<h3>'+t+'</h3>'+html:''}
  function ckGet(key){var c=S.chk[S.pid]||{}; return c[key]||''}
  function ckSet(key,v){var c=S.chk[S.pid]=S.chk[S.pid]||{}; if(c[key]===v) delete c[key]; else c[key]=v}
  function issueFor(key){return S.issues.some(function(i){return i.pid===S.pid&&i.src===key})}

  var IDX=null;
  function buildIdx(){
    var ix=[];
    KBD.stages.forEach(function(s,n){ix.push({tab:'checklist',id:s.id,title:'Giai đoạn '+(n+1)+': '+s.name,text:[s.name,s.goal].concat(s.items.map(function(i){return i[0]}),s.ask,s.stop).join(' ')})});
    KBD.procs.forEach(function(p){ix.push({tab:'quy-trinh',id:p.id,title:p.title,text:[p.title,p.group,p.mats].concat(p.std,p.prep,p.steps,p.accept,p.errors).join(' ')})});
    KBD.defects.forEach(function(d){ix.push({tab:'loi',id:d.id,title:d.title,text:[d.title,d.area].concat(d.causes,d.prevent,d.fix).join(' ')})});
    KBD.incidents.forEach(function(d){ix.push({tab:'su-co',id:d.id,title:d.title,text:[d.title,d.area].concat(d.causes,d.prevent,d.fix).join(' ')})});
    KBD.sampling.forEach(function(m,n){ix.push({tab:'nghiem-thu',id:'sm'+n,title:'Lấy mẫu: '+m.name,text:[m.name,m.tests,m.std,m.sample,m.lotText].join(' ')})});
    KBD.itp.forEach(function(t){ix.push({tab:'nghiem-thu',id:'itp',title:t[0]+' '+t[1],text:t.join(' ')})});
    if(KBD.qa){
      ix.push({tab:'qa',id:'qa-plan',title:'Kế hoạch chất lượng dự án',text:[KBD.qa.intro].concat(KBD.qa.planSteps,KBD.qa.planContent,KBD.qa.qaProcesses).join(' ')});
      ix.push({tab:'qa',id:'qa-hold',title:'Điểm dừng nghiệm thu bắt buộc',text:KBD.qa.holdPoints.concat(KBD.qa.flowCtrl.map(function(f){return f.join(' ')})).join(' ')});
      ix.push({tab:'qa',id:'qa-role',title:'Vai trò QA và QC',text:KBD.qa.roles.map(function(r){return r.join(' ')}).join(' ')});
      ix.push({tab:'qa',id:'qa-ncr',title:'Quy trình xử lý NCR',text:KBD.qa.ncrFlow.join(' ')});
      ix.push({tab:'qa',id:'qa-rec',title:'Hệ thống hồ sơ chất lượng',text:KBD.qa.records.join(' ')});
      ix.push({tab:'qa',id:'qa-gloss',title:'Thuật ngữ QA QC NCR ITP RFI',text:KBD.qa.glossary.map(function(g){return g.join(' ')}).join(' ')});
    }
    S.guides.forEach(function(g){ix.push({tab:'cong-ty',id:g.id,title:g.title,text:[g.title,g.cat,g.criteria,g.mats].concat(g.steps).join(' ')})});
    ix.forEach(function(r){r.n=norm(r.text); r.tn=norm(r.title)});
    return ix;
  }
  function tabName(t){return (LTABS.filter(function(x){return x[0]===t})[0]||['',''])[1]}
  function snippet(r,toks){
    var p=-1; toks.forEach(function(t){var i=r.n.indexOf(t); if(i>=0&&(p<0||i<p)) p=i});
    if(p<0) return '';
    var raw=r.text, a=Math.max(0,p-40);
    return (a>0?'… ':'')+raw.slice(a,a+120).replace(/\s+/g,' ')+'…';
  }
  function searchView(){
    if(!IDX) IDX=buildIdx();
    var toks=norm(lib.q).split(/\s+/).filter(Boolean);
    var hits=IDX.filter(function(r){return toks.every(function(t){return r.n.indexOf(t)>=0})});
    hits.sort(function(a,b){var ta=toks.every(function(t){return a.tn.indexOf(t)>=0})?0:1, tb=toks.every(function(t){return b.tn.indexOf(t)>=0})?0:1; return ta-tb});
    if(!hits.length) return '<p class="empty">Không thấy kết quả cho "'+esc(lib.q)+'". Thử từ khóa ngắn hơn, ví dụ: chống thấm, ốp lát, cọc, thép.</p>';
    return '<p class="sub">'+hits.length+' kết quả</p>'+hits.slice(0,40).map(function(r){
      return '<button type="button" class="res" data-open="'+r.tab+'|'+r.id+'"><b>'+esc(r.title)+'</b> <span class="pill muted">'+esc(tabName(r.tab))+'</span><small>'+esc(snippet(r,toks))+'</small></button>';
    }).join('')+(hits.length>40?'<p class="note">Chỉ hiện 40 kết quả đầu, hãy thêm từ khóa để thu hẹp.</p>':'');
  }

  function libChecklist(){
    var total=0, done=0, fail=0;
    KBD.stages.forEach(function(s){s.items.forEach(function(it,i){total++; var v=ckGet(s.id+'.'+i); if(v==='ok') done++; if(v==='fail') fail++})});
    var pc=total?Math.round(done/total*100):0;
    var out='<section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Dự án: '+esc(proj().name)+'</b><span><span class="pill good">Đạt '+done+'</span> <span class="pill bad">Không đạt '+fail+'</span> <span class="pill muted">Chưa kiểm '+(total-done-fail)+'</span></span></div><div class="meter" style="margin:8px 0 4px"><i style="width:'+pc+'%"></i></div><small style="color:var(--muted)">Tiến độ kiểm tra '+pc+'%. Kết quả lưu riêng theo từng dự án. Mục không đạt có thể chuyển thành vấn đề để theo dõi xử lý.</small></section>';
    out+='<details class="kb"><summary><b>10 nguyên tắc phải nhớ</b></summary><div class="body">'+ol(KBD.goldRules)+'</div></details>';
    out+=KBD.stages.map(function(s,n){
      var d=0,f=0; s.items.forEach(function(it,i){var v=ckGet(s.id+'.'+i); if(v==='ok')d++; if(v==='fail')f++});
      var rows=s.items.map(function(it,i){
        var key=s.id+'.'+i, v=ckGet(key), lv=LV[it[1]];
        var mk=v==='fail'?(issueFor(key)?'<span class="pill muted">Đã tạo vấn đề</span>':'<button type="button" class="btn ghost sm" data-mkiss="'+key+'">Tạo vấn đề</button>'):'';
        return '<div class="ckrow"><span class="pill '+lv[1]+'">'+lv[0]+'</span><span>'+esc(it[0])+'</span><span class="acts">'+mk+
          '<button type="button" class="btn ghost sm okb" data-ck="'+key+'|ok" aria-pressed="'+(v==='ok')+'">Đạt</button>'+
          '<button type="button" class="btn ghost sm failb" data-ck="'+key+'|fail" aria-pressed="'+(v==='fail')+'">Không đạt</button></span></div>';
      }).join('');
      return '<details class="kb" id="kb-'+s.id+'"'+(lib.open===s.id?' open':'')+'><summary><b>'+(n+1)+'. '+esc(s.name)+'</b>'+(f?'<span class="pill bad">'+f+' không đạt</span>':'')+'<span class="pill '+(d===s.items.length?'good':'muted')+'">'+d+'/'+s.items.length+'</span></summary><div class="body"><p style="margin:12px 0 0;color:var(--muted)">'+esc(s.goal)+'</p>'+
        sec('Việc cần kiểm tra',rows)+sec('Câu cần hỏi nhà thầu',ul(s.ask))+sec('Dấu hiệu phải dừng lại',ul(s.stop))+'</div></details>';
    }).join('');
    var ph=KBD.photoList.map(function(t,i){
      var key='photo.'+i, v=ckGet(key);
      return '<div class="ckrow" style="grid-template-columns:1fr auto"><span>'+(i+1)+'. '+esc(t)+'</span><span class="acts"><button type="button" class="btn ghost sm okb" data-ck="'+key+'|ok" aria-pressed="'+(v==='ok')+'">Đã chụp</button></span></div>';
    }).join('');
    out+='<details class="kb"><summary><b>15 việc bắt buộc phải chụp ảnh lưu hồ sơ</b></summary><div class="body">'+ph+'</div></details>';
    return out;

  function fileClick(e){
    var t=e.target, b;
    if(trClick(t)) return true;
    if((b=t.closest('[data-fopen]'))){openFile(b.getAttribute('data-fopen'),b.getAttribute('data-fn'),b.getAttribute('data-ft')); return true}
    if((b=t.closest('[data-fdel]'))){
      var a=b.getAttribute('data-fdel').split('|'), o=fileObj(a[0],a[1]);
      if(o&&window.confirm('Xóa tệp đính kèm này?')){o.files=(o.files||[]).filter(function(f){return f.id!==a[2]}); FILES.del(a[2]).catch(function(){}); save(); render()}
      return true;
    }
    if(t.closest('[data-xlgo]')){xlGo(); return true}
    if((b=t.closest('[data-tsel]'))){tp.sel=b.getAttribute('data-tsel'); tp.paras=null; tp.tags=[]; tp.html=''; tp.unknown=[]; render(); tpLoad(); return true}
    if((b=t.closest('[data-tdel]'))){
      var tt=(S.ctpl||[]).filter(function(x){return x.id===b.getAttribute('data-tdel')})[0];
      if(tt&&window.confirm('Xóa mẫu "'+tt.name+'"?')){FILES.del(tt.fileId).catch(function(){}); S.ctpl=S.ctpl.filter(function(x){return x!==tt}); if(tp.sel===tt.id){tp.sel=''; tp.html=''; tp.buf=null} save(); render()}
      return true;

  function refreshDoc(){var p=document.getElementById('docPrev'); if(p) p.innerHTML=docHtml()}
  function docAction(a){
    var prev=document.getElementById('docPrev'), msg=document.getElementById('docMsg'), t=tplById(dr.tpl);
    function say(s){if(msg) msg.textContent=s}
    if(!prev||!t) return;
    if(window.SCT) SCT.log('ev',(a==='print'?'In':a==='word'?'Xuất Word':'Sao chép')+' biểu mẫu: '+t.title);
    if(a==='print'){try{window.print(); say('Đã gửi lệnh in. Nếu không thấy hộp thoại in, hãy mở bản cài trên máy hoặc điện thoại.')}catch(e){say('Trình duyệt này chặn in.')}}
    else if(a==='word'){
      try{
        var css='body{font:13pt "Times New Roman",serif} h1{font-size:15pt;text-align:center;text-transform:uppercase} h2{font-size:13pt} table{border-collapse:collapse;width:100%} .tb th,.tb td{border:1px solid #000;padding:3px 6px} .qh,.ds{text-align:center} .dl{text-align:right} .sg td{text-align:center} .lh td{text-align:center;vertical-align:top;width:50%}';
        var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+esc(t.title)+'</title><style>'+css+'</style></head><body>'+prev.innerHTML+'</body></html>';
        var url=URL.createObjectURL(new Blob(['﻿'+html],{type:'application/msword'})), el=document.createElement('a');
        el.href=url; el.download=t.title.replace(/\s+/g,'-')+'.doc'; document.body.appendChild(el); el.click();
        setTimeout(function(){URL.revokeObjectURL(url); el.remove()},1500); say('Đã tạo file Word. Nếu không có file tải về, hãy dùng bản cài trên máy hoặc điện thoại.');
      }catch(e){say('Trình duyệt này chặn tải file.')}
    } else if(a==='copy'){
      var txt=prev.innerText;
      function sel(){var r=document.createRange(); r.selectNodeContents(prev); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); say('Đã bôi đen nội dung, nhấn Ctrl+C để sao chép.')}
      try{navigator.clipboard.writeText(txt).then(function(){say('Đã sao chép nội dung.')},sel)}catch(e){sel()}
    }
  }
  function calcSamples(){
    var sel=document.getElementById('smSel'), qty=document.getElementById('smQty'), out=document.getElementById('smOut'); if(!sel||!qty||!out) return;
    var m=KBD.sampling[parseInt(sel.value,10)], q=parseFloat(qty.value);
    if(!m||!(q>0)){out.textContent='Nhập khối lượng để biết số tổ mẫu tối thiểu.'; return}
    var n=Math.ceil(q/m.lot);
    out.textContent='Cần tối thiểu '+n+' tổ mẫu ('+m.name+', lô '+m.lot.toLocaleString('vi-VN')+' '+m.unit+'). Mẫu: '+m.sample+'.';
  }
  document.addEventListener('input',function(e){
    if(fileInput(e)) return;
    if(e.target.id==='kbq'){lib.q=e.target.value; var b=document.getElementById('kbBody'); if(b) b.innerHTML=libBody(); var t=document.querySelectorAll('[data-ltab]'); for(var i=0;i<t.length;i++) t[i].setAttribute('aria-pressed',(!lib.q&&t[i].getAttribute('data-ltab')===lib.tab)?'true':'false'); return}
    if(e.target.id==='smQty') calcSamples();
    var tg=e.target;
    if(tg.getAttribute&&tg.getAttribute('data-ff')){dr.f[tg.getAttribute('data-ff')]=tg.value; refreshDoc(); return}
    if(tg.getAttribute&&tg.getAttribute('data-ca')){var P0=proj(), A0=S.clients.filter(function(c){return c.id===P0.client})[0]; if(A0){A0[tg.getAttribute('data-ca')]=tg.value; save(); refreshDoc()} return}
  });
  document.addEventListener('change',function(e){
    if(fileChange(e)) return;
    if(e.target.id==='smSel'){calcSamples(); return}
    if(e.target.id==='tplSel'){dr.tpl=e.target.value; dr.src=''; var tt=tplById(dr.tpl); dr.f=tt?tplDefaults(tt):{}; render(); return}
    if(e.target.id==='srcSel'){dr.src=e.target.value; render(); return}
    if(e.target.id==='co_logo'){
      var fl=e.target.files&&e.target.files[0]; if(!fl) return;
      if(fl.size>300*1024){alert_msg('coMsg','Logo lớn hơn 300 KB, hãy chọn ảnh nhỏ hơn.'); return}
      var rd=new FileReader(); rd.onload=function(){S.company=S.company||{}; S.company.logo=rd.result; save(); render()}; rd.readAsDataURL(fl); return}
    if(e.target.id==='projSel'){S.pid=e.target.value; save(); render(); return}
    if(e.target.id==='fMin'){fMin=e.target.value; render(); return}
    if(e.target.id==='fDoc'){fDoc=e.target.value; render(); return}
    if(e.target.id==='fGuide'){fGuide=e.target.value; render(); return}
    if(e.target.id==='curPhase'){proj().phase=e.target.value; save(); render(); return}
    if(e.target.id==='mType'){
      var ta=document.getElementById('mContent'), cur=ta.value.trim();
      var isTpl=!cur||Object.keys(TPL).some(function(k){return TPL[k]===ta.value});
      if(isTpl) ta.value=TPL[e.target.value]||'';
      return;
    }
    var id=e.target.getAttribute('data-pct');
    if(id){
      var v=clamp(parseInt(e.target.value,10)||0,0,100);
      S.tasks.forEach(function(t){if(t.id===id) t.pct=v});
      save(); render();
    }
  });
  document.addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target.id, g=function(i){return document.getElementById(i).value};
    var FL={taskForm:'Thêm hạng mục tiến độ',logForm:'Ghi nhật ký thi công',txForm:'Nhập xuất vật tư',expForm:'Thêm khoản chi',reqForm:'Gửi đề nghị phê duyệt',contractForm:'Thêm hợp đồng',payForm:'Thêm đợt thanh toán',minForm:'Thêm biên bản',docForm:'Lưu hồ sơ thiết kế',issForm:'Thêm vấn đề',projForm:'Thêm dự án',clientForm:'Thêm khách hàng',delivForm:'Thêm sản phẩm thiết kế',quoteForm:'Tạo báo giá',qitemForm:'Thêm hạng mục báo giá',guideForm:'Lưu hướng dẫn',lotForm:'Nghiệm thu lô vật tư',companyForm:'Lưu thông tin công ty'};
    if(window.SCT&&FL[f]) SCT.log('ev','Lưu: '+FL[f]);
    if(f==='taskForm'){
      if(ts(g('tEnd'))<ts(g('tStart'))){alert_inline('Ngày kết thúc phải sau ngày bắt đầu.'); return}
      S.tasks.push({id:nid('t'),pid:S.pid,name:g('tName').trim(),start:g('tStart'),end:g('tEnd'),pct:0});
    }else if(f==='logForm'){
      S.logs.push({id:nid('l'),pid:S.pid,date:g('lDate'),weather:g('lWeather'),workers:parseInt(g('lWorkers'),10)||0,work:g('lWork').trim(),issues:g('lIssues').trim()});
    }else if(f==='txForm'){
      var q=parseFloat(g('xQty')); if(!(q>0)) return;
      var m=S.mats.filter(function(i){return i.id===g('xMat')})[0]; if(!m) return;
      var type=g('xType');
      if(type==='in') m.recv+=q; else m.used+=q;
      S.txs.push({id:nid('x'),pid:S.pid,date:g('xDate'),mat:m.id,type:type,qty:q,note:g('xNote').trim()});
    }else if(f==='expForm'){
      var a=parseFloat(g('eAmt')); if(!(a>0)) return;
      S.exps.push({id:nid('e'),pid:S.pid,date:g('eDate'),cat:g('eCat'),amt:a,note:g('eNote').trim()});
    }else if(f==='reqForm'){
      S.reqs.push({id:nid('r'),pid:S.pid,title:g('rTitle').trim(),type:g('rType'),amt:parseFloat(g('rAmt'))||0,by:g('rBy').trim(),date:TODAY,status:'cho'});
    }else if(f==='contractForm'){
      S.contracts.push({id:nid('k'),pid:S.pid,no:g('cNo').trim(),title:g('cTitle').trim(),party:g('cParty').trim(),type:g('cType'),value:parseFloat(g('cValue'))||0,signed:g('cSigned'),start:g('cStart'),end:g('cEnd'),pays:[]});
    }else if(f==='payForm'){
      var kk=S.contracts.filter(function(k){return k.id===g('pK')})[0]; if(!kk) return;
      kk.pays.push({id:nid('y'),label:g('pLabel').trim(),amt:parseFloat(g('pAmt'))||0,due:g('pDue'),paid:''});
    }else if(f==='minForm'){
      S.minutes.push({id:nid('n'),pid:S.pid,type:g('mType'),title:g('mTitle').trim(),date:g('mDate'),place:g('mPlace').trim(),attendees:g('mAtt').trim(),content:g('mContent').trim(),signed:g('mSign')});
    }else if(f==='docForm'){
      var code=g('dCode').trim(), ver={rev:g('dRev').trim(),date:g('dDate'),note:g('dNote').trim(),status:g('dStatus')};
      var ex=S.docs.filter(function(d){return d.pid===S.pid&&d.code.toLowerCase()===code.toLowerCase()})[0];
      if(ex){ex.versions.push(ver); if(g('dName').trim()) ex.name=g('dName').trim(); ex.disc=g('dDisc'); if(g('dLink').trim()) ex.link=g('dLink').trim()}
      else S.docs.push({id:nid('d'),pid:S.pid,code:code,name:g('dName').trim()||code,disc:g('dDisc'),link:g('dLink').trim(),versions:[ver]});
    }else if(f==='issForm'){
      S.issues.push({id:nid('i'),pid:S.pid,title:g('iTitle').trim(),type:g('iType'),prio:g('iPrio'),owner:g('iOwner').trim(),due:g('iDue'),status:'mo'});
    }else if(f==='projForm'){
      var np={id:nid('p'),name:g('jName').trim(),addr:g('jAddr').trim(),type:g('jType'),mode:g('jMode'),client:g('jClient'),manager:g('jMgr').trim(),phase:g('jPhase')};
      S.projects.push(np); S.pid=np.id;
    }else if(f==='clientForm'){
      S.clients.push({id:nid('c'),name:g('kName').trim(),phone:g('kPhone').trim(),email:g('kEmail').trim(),source:g('kSource'),stage:g('kStage'),note:g('kNote').trim()});
    }else if(f==='delivForm'){
      S.deliv.push({id:nid('v'),pid:S.pid,phase:g('vPhase'),name:g('vName').trim(),disc:g('vDisc'),done:false});
    }else if(f==='quoteForm'){
      S.quotes.push({id:nid('q'),pid:S.pid,no:g('qNo').trim(),title:g('qTitle').trim(),date:g('qDate'),status:'nhap',vat:parseFloat(g('qVat'))||0,items:[]});
    }else if(f==='qitemForm'){
      var qq=S.quotes.filter(function(q){return q.id===g('zQ')})[0]; if(!qq) return;
      qq.items.push({id:nid('z'),name:g('zName').trim(),unit:g('zUnit').trim(),qty:parseFloat(g('zQty'))||0,price:parseFloat(g('zPrice'))||0});
    }else if(f==='guideForm'){
      S.guides.push({id:nid('g'),cat:g('gCat'),title:g('gTitle').trim(),steps:g('gSteps').split('\n').map(function(x){return x.trim()}).filter(Boolean),criteria:g('gCrit').trim(),mats:g('gMats').trim()});
    }else if(f==='lotForm'){
      var lq=parseFloat(g('lQty')); if(!(lq>0)) return;
      var lm=S.mats.filter(function(i){return i.id===g('lMat')})[0]; if(!lm) return;
      var checks={}, all=true;
      CK.forEach(function(c){var v=document.getElementById('ck_'+c[0]).checked; checks[c[0]]=v; if(!v) all=false});
      var res=all?'dat':g('lRes');
      S.lots.push({id:nid('o'),pid:S.pid,mat:lm.id,date:g('lDate'),qty:lq,supplier:g('lSup').trim(),no:g('lNo').trim(),checks:checks,result:res,note:g('lNote').trim()});
      if(res==='dat'){lm.recv+=lq; S.txs.push({id:nid('x'),pid:S.pid,date:g('lDate'),mat:lm.id,type:'in',qty:lq,note:'Nghiệm thu đạt, lô '+g('lNo').trim()})}
    }else if(f==='companyForm'){
      S.company=S.company||{}; CF.forEach(function(x){S.company[x[0]]=g('co_'+x[0]).trim()});
      save(); render(); var cm=document.getElementById('coMsg'); if(cm) cm.textContent='Đã lưu'; return;
    }else return;
    save(); render();
  });
  function alert_msg(id,msg){var n=document.getElementById(id); if(n){n.style.color='var(--bad)'; n.textContent=msg}}
  function alert_inline(msg){
    var n=document.getElementById('formMsg');
    if(!n){n=document.createElement('p'); n.id='formMsg'; n.style.cssText='color:var(--bad);margin:8px 0 0'; document.getElementById('taskForm').appendChild(n)}
    n.textContent=msg;
  }
  var h=(location.hash||'').replace('#','');
  if(h==='huong-dan') h='tv-checklist';
  if(RENDER[h]) S.view=h;
  /* Kiến thức: mở một đầu mục thì các đầu mục cùng danh sách tự thu gọn */
  document.addEventListener('toggle',function(e){
    var d=e.target; if(!d||!d.matches||!d.matches('details.kb')||!d.open) return;
    var box=d.parentNode; if(!box) return;
    Array.prototype.forEach.call(box.children,function(x){if(x!==d&&x.tagName==='DETAILS'&&x.classList.contains('kb')&&x.open) x.open=false});
    if(d.id&&d.id.indexOf('kb-')===0&&box.closest&&box.closest('#kbBody')) lib.open=d.id.slice(3);
  },true);
  if(window.SCT){
    SCT.log('ev','Dữ liệu: '+S.projects.length+' dự án, '+(S.clients||[]).length+' khách hàng');
    var lgT=0; SCT.onLive(function(en){
      if(S.view==='phien-ban'){clearTimeout(lgT); lgT=setTimeout(function(){var L=document.getElementById('lgList'); if(L) L.innerHTML=logRows()},400)}
      if(en.l==='err') setTimeout(renderNav,0);
    });
    if(S.seenVer&&S.seenVer!==SCT.ver) setTimeout(function(){flash('Đã cập nhật lên phiên bản '+SCT.label(SCT.ver)+'. Xem có gì mới trong Công ty › Phiên bản và nhật ký.')},1200);
    else if(!S.seenVer){S.seenVer=SCT.ver; save()}
  }
  render();
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(function(){}) }
})();
</script>
